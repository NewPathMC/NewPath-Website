{% assign website_release = site.data["website-release"] %}
{% if website_release.enabled %}
<style>
  html.np-release-gate-redirecting body {
    visibility: hidden !important;
  }
</style>
<script>
(function () {
  var targetRaw = "{{ website_release.target_date }}".trim();
  var countdownPath = "{{ website_release.countdown_path | relative_url }}";
  var homePath = "{{ website_release.home_path | relative_url }}";

  function normalizePath(path) {
    if (!path) return "/";
    try {
      path = new URL(path, window.location.origin).pathname;
    } catch (_) {}

    if (path.charAt(0) !== "/") {
      path = "/" + path;
    }

    if (path.length > 1 && path.endsWith("/")) {
      path = path.slice(0, -1);
    }

    return path || "/";
  }

  function releaseKey() {
    return "np-website-release-done:" + targetRaw;
  }

  function getStoredRelease() {
    if (!targetRaw) return false;

    try {
      return window.localStorage.getItem(releaseKey()) === "1";
    } catch (_) {
      return false;
    }
  }

  function storeRelease() {
    if (!targetRaw) return;

    try {
      window.localStorage.setItem(releaseKey(), "1");
    } catch (_) {}
  }

  var currentPath = normalizePath(window.location.pathname);
  var countdown = normalizePath(countdownPath || "/countdown.html");
  var home = normalizePath(homePath || "/");
  var target = targetRaw ? new Date(targetRaw) : null;
  var validTarget = target && !Number.isNaN(target.getTime());
  var releasedByDate = validTarget ? Date.now() >= target.getTime() : false;
  var released = releasedByDate || getStoredRelease();

  if (releasedByDate) {
    storeRelease();
  }

  if (!released && currentPath !== countdown) {
    document.documentElement.classList.add("np-release-gate-redirecting");
    window.location.replace(countdown);
    return;
  }

  if (released && currentPath === countdown) {
    document.documentElement.classList.add("np-release-gate-redirecting");
    window.location.replace(home);
  }
})();
</script>
{% endif %}
